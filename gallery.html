
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Oni & Ada</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap');

:root {
  --bg: #080a10;
  --silver: #c6cbd7;
  --muted: #858b9b;
  --line: #303543;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: #edf0f5;
  font-family: 'Inter', sans-serif;
  font-weight: 300;
}

header {
  padding: 24px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
}

.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 27px;
  letter-spacing: 3px;
}

nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

nav a:hover { color: white; }

.hero {
  text-align: center;
  padding: 90px 20px 65px;
  background:
    linear-gradient(#080a1050, #080a10d9),
    url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1800') center/cover;
}

.eyebrow {
  color: var(--silver);
  font-size: 10px;
  letter-spacing: 5px;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: clamp(48px, 9vw, 85px);
  letter-spacing: 5px;
  margin: 18px 0;
}

.hero p {
  color: #c2c6d0;
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-style: italic;
}

.gallery {
  max-width: 1150px;
  margin: auto;
  padding: 65px 25px 90px;
}

.gallery-heading {
  display: flex;
  justify-content: space-between;
  align-items: end;
  margin-bottom: 30px;
}

.gallery-heading span {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 3px;
}

.gallery-heading h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 38px;
  font-weight: 400;
  margin: 8px 0 0;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
}

.gallery-item {
  grid-column: span 4;
  margin: 0;
  overflow: hidden;
  border: 1px solid #424757;
  background: #10131c;
  cursor: pointer;
}

.gallery-item.featured {
  grid-column: span 8;
}

.gallery-item img {
  display: block;
  width: 100%;
  height: 300px;
  object-fit: cover;
  transition: transform .5s ease;
}

.gallery-item:hover img {
  transform: scale(1.04);
}

.gallery-item figcaption {
  padding: 13px 15px;
  color: var(--silver);
  font-size: 11px;
  letter-spacing: 3px;
  border-top: 1px solid #424757;
}

.lightbox {
  display: none;
  position: fixed;
  z-index: 9999;
  inset: 0;
  background: rgba(5, 7, 14, .95);
  align-items: center;
  justify-content: center;
  padding: 35px;
}

.lightbox.active { display: flex; }

.lightbox img {
  max-width: 92%;
  max-height: 88vh;
  object-fit: contain;
}

.lightbox-close {
  position: absolute;
  top: 20px;
  right: 30px;
  color: white;
  font-size: 38px;
  cursor: pointer;
  background: none;
  border: none;
}

footer {
  text-align: center;
  padding: 35px 15px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 3px;
}

@media(max-width:700px) {
  .gallery-grid { grid-template-columns: repeat(2, 1fr); }
  .gallery-item,
  .gallery-item.featured { grid-column: span 1; }
  .gallery-item img { height: 190px; }
  .lightbox { padding: 12px; }
  .lightbox img { max-width: 100%; }
}
</style>
</head>

<body>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <img id="lightboxImage" src="" alt="Enlarged gallery photo">
</div>

<footer>
  ONI & ADA · THE UNDERWORLD ARCHIVE · 2026
</footer>

<script>
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");

document.querySelectorAll(".gallery-item img").forEach(image => {
  image.addEventListener("click", () => {
    lightboxImage.src = image.src;
    lightbox.classList.add("active");
  });
});

document.getElementById("lightboxClose").addEventListener("click", () => {
  lightbox.classList.remove("active");
});

lightbox.addEventListener("click", event => {
  if (event.target === lightbox) {
    lightbox.classList.remove("active");
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    lightbox.classList.remove("active");
  }
});
</script>
